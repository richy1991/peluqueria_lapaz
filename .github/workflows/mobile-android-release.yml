name: Publicar APK de LEGEND CLUB

on:
  workflow_dispatch:
    inputs:
      expo_artifact_url:
        description: URL del APK compilado por EAS (https://expo.dev/artifacts/eas/...apk)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-android:
    name: Publicar APK para Android y Huawei
    runs-on: ubuntu-latest
    steps:
      - name: Descargar y validar el APK de Expo
        id: artifact
        env:
          EXPO_ARTIFACT_URL: ${{ inputs.expo_artifact_url }}
        run: |
          set -euo pipefail
          case "$EXPO_ARTIFACT_URL" in
            https://expo.dev/artifacts/eas/*.apk) ;;
            *) echo "Usa el enlace APK de expo.dev/artifacts/eas." >&2; exit 1 ;;
          esac
          apk="$RUNNER_TEMP/legend-club-android.apk"
          curl --fail --location --retry 3 --output "$apk" "$EXPO_ARTIFACT_URL"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          EXPO_ARTIFACT_URL: ${{ inputs.expo_artifact_url }}
        run: |
          set -euo pipefail
          tag="mobile-apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$APK_PATH#legend-club-android.apk" \
            --target "$GITHUB_SHA" \
            --title "LEGEND CLUB Android ${GITHUB_RUN_NUMBER}" \
            --notes "APK para Android y Huawei. Compilado con EAS: ${EXPO_ARTIFACT_URL}" \
            --latest
          echo "### APK listo para instalar" >> "$GITHUB_STEP_SUMMARY"
          echo "[Descargar LEGEND CLUB para Android y Huawei](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/legend-club-android.apk)" >> "$GITHUB_STEP_SUMMARY"
